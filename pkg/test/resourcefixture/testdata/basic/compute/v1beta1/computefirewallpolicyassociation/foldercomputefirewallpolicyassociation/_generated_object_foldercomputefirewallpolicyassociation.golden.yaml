apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeFirewallPolicyAssociation
metadata:
  annotations:
    cnrm.cloud.google.com/management-conflict-prevention-policy: none
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: ${associationID}
  namespace: ${uniqueId}
spec:
  attachmentTargetRef:
    kind: Folder
    name: folder-${uniqueId}
  firewallPolicyRef:
    name: firewallpolicy-${uniqueId}
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  externalRef: locations/global/firewallPolicies/${firewallPolicyID}/associations/${associationID}
  observedGeneration: 1
  shortName: ${associationID}
